<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تبديل المواعيد الدراسية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg border-b border-indigo-800">
        <div class="max-w-6xl mx-auto px-4 py-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight">
                <i class="fa-solid fa-arrow-rotate-left text-amber-400 ml-2"></i>منصة تبديل المواعيد والسكاشن
            </h1>
            <p class="mt-2 text-indigo-100 text-sm md:text-base">تبادل المواعيد بسهولة مع زملائك والتوافق التلقائي عبر الواتساب</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Registration Form (5 cols) -->
        <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit sticky top-6">
            <h2 class="text-xl font-bold text-slate-800 border-b border-slate-100 pb-3 mb-4 flex items-center">
                <i class="fa-solid fa-pen-to-square text-indigo-600 ml-2"></i>تسجيل طلب تبديل
            </h2>

            <form id="swapForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم الطالب / الطالبة <span class="text-rose-500">*</span></label>
                    <input type="text" id="studentName" required placeholder="أدخل اسمك بالكامل" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم الواتساب / التليفون <span class="text-rose-500">*</span></label>
                    <input type="tel" id="studentPhone" required placeholder="مثال: 01012345678" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ميعادك المسجل حالياً <span class="text-rose-500">*</span></label>
                    <select id="currentSlot" required onchange="checkInstantMatch()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                        <option value="" disabled selected>اختر ميعادك الحالي...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">الميعاد الذي ترغب بالتبديل إليه <span class="text-rose-500">*</span></label>
                    <select id="desiredSlot" required onchange="checkInstantMatch()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                        <option value="" disabled selected>اختر الميعاد المطلوب...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ملاحظات إضافية (اختياري)</label>
                    <textarea id="notes" rows="2" placeholder="أين تريد التجمع؟ أو أي شروط أخرى..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></textarea>
                </div>

                <!-- Instant Live Match Banner -->
                <div id="instantMatchBox" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-xs leading-relaxed">
                    <div class="font-bold flex items-center gap-1 text-emerald-700 mb-1">
                        <i class="fa-solid fa-bolt text-amber-500"></i> يوجد طالب متوافق معك حالياً!
                    </div>
                    <div id="instantMatchDetails"></div>
                </div>

                <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition-colors text-sm shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> نشر طلب التبديل
                </button>
            </form>
        </section>

        <!-- Right Column: Matches & All Requests (7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Smart Auto-Matches Container -->
            <div id="smartMatchesContainer" class="hidden space-y-3">
                <h3 class="text-base font-bold text-emerald-800 flex items-center gap-2 bg-emerald-100/60 p-3 rounded-xl border border-emerald-200">
                    <i class="fa-solid fa-wand-magic-sparkles text-emerald-600"></i> فرص التبديل المتوافقة أوتوماتيكياً
                </h3>
                <div id="smartMatchesList" class="space-y-3"></div>
            </div>

            <!-- Search & Filters -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-indigo-600"></i> جميع الطلبات المسجلة
                    </h2>
                    <span id="requestsCount" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">0 طلب</span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input type="text" id="searchInput" oninput="renderRequests()" placeholder="بحث باسم الطالب..." class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-md outline-none focus:border-indigo-500">
                    <select id="filterSlot" onchange="renderRequests()" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-md outline-none focus:border-indigo-500 bg-white">
                        <option value="">جميع المواعيد المسجلة</option>
                    </select>
                </div>
            </div>

            <!-- Requests List -->
            <div id="requestsList" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </section>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-4 text-center text-xs mt-auto">
        <p>نظام تبديل المواعيد والسكاشن الجامعية © 2026</p>
    </footer>

    <!-- Application Script -->
    <script>
        // Available Schedule Slots Data
        const daysData = [
            { dates: "(الاربعاء 21/10 والثلاثاء 27/10)" },
            { dates: "(السبت 24/10 والاربعاء 28/10)" },
            { dates: "(الاحد 25/10 والخميس 29/10)" },
            { dates: "(الاثنين 26/10 والسبت 31/10)" }
        ];

        const times = ["7 ص", "8:30 ص", "10 ص", "12 م", "1:30 م", "3 م"];
        const groups = ["A", "B"];

        let availableSlots = [];
        daysData.forEach(day => {
            times.forEach(time => {
                groups.forEach(group => {
                    availableSlots.push(`${day.dates} - ${time} (مجموعة ${group})`);
                });
            });
        });

        // Initialize with empty array (No demo/example entries)
        let requests = JSON.parse(localStorage.getItem('swap_requests')) || [];

        // Initialize Options & UI
        window.addEventListener('DOMContentLoaded', () => {
            populateDropdowns();
            renderRequests();
        });

        function populateDropdowns() {
            const currentSelect = document.getElementById('currentSlot');
            const desiredSelect = document.getElementById('desiredSlot');
            const filterSelect = document.getElementById('filterSlot');

            availableSlots.forEach(slot => {
                currentSelect.appendChild(new Option(slot, slot));
                desiredSelect.appendChild(new Option(slot, slot));
                filterSelect.appendChild(new Option(slot, slot));
            });
        }

        // Save & Submit Handlers
        function saveRequests() {
            localStorage.setItem('swap_requests', JSON.stringify(requests));
            renderRequests();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const currentSlot = document.getElementById('currentSlot').value;
            const desiredSlot = document.getElementById('desiredSlot').value;
            const notes = document.getElementById('notes').value.trim();

            if (currentSlot === desiredSlot) {
                alert('عذراً، يجب اختيار ميعاد مختلف عن ميعادك الحالي للتبديل!');
                return;
            }

            const newReq = {
                id: Date.now().toString(),
                name,
                phone,
                currentSlot,
                desiredSlot,
                notes,
                createdAt: new Date().toISOString()
            };

            requests.unshift(newReq);
            saveRequests();

            // Reset Form
            document.getElementById('swapForm').reset();
            document.getElementById('instantMatchBox').classList.add('hidden');
            alert('تم تسجيل طلبك بنجاح! يمكنك الاطلاع على التوافقات في القائمة.');
        }

        // Live Instant Match Checker
        function checkInstantMatch() {
            const current = document.getElementById('currentSlot').value;
            const desired = document.getElementById('desiredSlot').value;
            const box = document.getElementById('instantMatchBox');
            const details = document.getElementById('instantMatchDetails');

            if (!current || !desired || current === desired) {
                box.classList.add('hidden');
                return;
            }

            // Look for reciprocal match
            const match = requests.find(r => r.currentSlot === desired && r.desiredSlot === current);

            if (match) {
                const waLink = generateWhatsAppLink(match.phone, match.name, current, desired);
                details.innerHTML = `
                    الطالب/ة <strong>${escapeHtml(match.name)}</strong> يمتلك الميعاد المطلوب ويبحث عن ميعادك!
                    <a href="${waLink}" target="_blank" class="mt-2 inline-flex items-center gap-1.5 bg-emerald-600 text-white font-bold px-3 py-1 rounded-md hover:bg-emerald-700 transition-colors text-xs">
                        <i class="fa-brands fa-whatsapp"></i> تواصل مع ${escapeHtml(match.name)} فوراً
                    </a>
                `;
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        // Auto Match Finder Engine
        function findSmartMatches() {
            const directMatches = [];
            
            for (let i = 0; i < requests.length; i++) {
                for (let j = i + 1; j < requests.length; j++) {
                    const reqA = requests[i];
                    const reqB = requests[j];

                    if (reqA.currentSlot === reqB.desiredSlot && reqA.desiredSlot === reqB.currentSlot) {
                        directMatches.push([reqA, reqB]);
                    }
                }
            }
            return directMatches;
        }

        // Render Function
        function renderRequests() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterSlot = document.getElementById('filterSlot').value;
            const container = document.getElementById('requestsList');
            const countLabel = document.getElementById('requestsCount');

            // 1. Render Smart Matches
            const smartContainer = document.getElementById('smartMatchesContainer');
            const smartList = document.getElementById('smartMatchesList');
            const directMatches = findSmartMatches();

            if (directMatches.length > 0) {
                smartContainer.classList.remove('hidden');
                smartList.innerHTML = directMatches.map(([a, b]) => {
                    const waA = generateWhatsAppLink(a.phone, a.name, b.currentSlot, b.desiredSlot);
                    const waB = generateWhatsAppLink(b.phone, b.name, a.currentSlot, a.desiredSlot);

                    return `
                        <div class="bg-emerald-50 border-2 border-emerald-300 p-4 rounded-xl shadow-sm text-xs relative">
                            <span class="absolute top-2 left-2 bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold text-[10px]">توافق مباشر 100%</span>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-1">
                                <div class="bg-white p-2.5 rounded-lg border border-emerald-200">
                                    <div class="font-bold text-slate-800 text-sm mb-1">${escapeHtml(a.name)}</div>
                                    <div class="text-slate-600">معاه: <span class="font-semibold text-emerald-700">${escapeHtml(a.currentSlot)}</span></div>
                                    <a href="${waA}" target="_blank" class="mt-2 inline-flex items-center gap-1 bg-emerald-600 text-white font-bold px-2.5 py-1 rounded hover:bg-emerald-700 text-[11px]">
                                        <i class="fa-brands fa-whatsapp"></i> واتساب ${escapeHtml(a.name)}
                                    </a>
                                </div>
                                <div class="bg-white p-2.5 rounded-lg border border-emerald-200">
                                    <div class="font-bold text-slate-800 text-sm mb-1">${escapeHtml(b.name)}</div>
                                    <div class="text-slate-600">معاه: <span class="font-semibold text-emerald-700">${escapeHtml(b.currentSlot)}</span></div>
                                    <a href="${waB}" target="_blank" class="mt-2 inline-flex items-center gap-1 bg-emerald-600 text-white font-bold px-2.5 py-1 rounded hover:bg-emerald-700 text-[11px]">
                                        <i class="fa-brands fa-whatsapp"></i> واتساب ${escapeHtml(b.name)}
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                smartContainer.classList.add('hidden');
            }

            // 2. Filter All Requests
            let filtered = requests.filter(req => {
                const matchesName = req.name.toLowerCase().includes(searchTerm);
                const matchesSlot = !filterSlot || req.currentSlot === filterSlot || req.desiredSlot === filterSlot;
                return matchesName && matchesSlot;
            });

            countLabel.textContent = `${filtered.length} طلب`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl text-center text-slate-400 border border-slate-200 text-xs">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p>لا توجد طلبات تبديل مسجلة حالياً.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(req => {
                const waLink = generateWhatsAppLink(req.phone, req.name, req.desiredSlot, req.currentSlot);
                return `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2 text-xs">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                            <span class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                <i class="fa-solid fa-user-graduate text-indigo-600"></i> ${escapeHtml(req.name)}
                            </span>
                            <button onclick="deleteRequest('${req.id}')" class="text-slate-400 hover:text-rose-600 text-xs" title="حذف الطلب">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 my-1">
                            <div class="bg-rose-50/70 p-2 rounded-lg border border-rose-100">
                                <span class="text-rose-600 font-bold block mb-0.5"><i class="fa-solid fa-clock ml-1"></i>الميعاد الحالي:</span>
                                <span class="text-slate-700 font-semibold">${escapeHtml(req.currentSlot)}</span>
                            </div>
                            <div class="bg-emerald-50/70 p-2 rounded-lg border border-emerald-100">
                                <span class="text-emerald-600 font-bold block mb-0.5"><i class="fa-solid fa-bullseye ml-1"></i>الميعاد المطلوب:</span>
                                <span class="text-slate-700 font-semibold">${escapeHtml(req.desiredSlot)}</span>
                            </div>
                        </div>

                        ${req.notes ? `<p class="text-slate-500 bg-slate-50 p-2 rounded border border-slate-100"><i class="fa-solid fa-circle-info ml-1 text-indigo-500"></i>${escapeHtml(req.notes)}</p>` : ''}

                        <div class="pt-1 flex justify-end">
                            <a href="${waLink}" target="_blank" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg transition-colors shadow-sm">
                                <i class="fa-brands fa-whatsapp text-sm"></i> تواصل عبر الواتساب
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteRequest(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الطلب؟')) {
                requests = requests.filter(r => r.id !== id);
                saveRequests();
            }
        }

        function generateWhatsAppLink(phone, name, myCurrent, myDesired) {
            let cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.startsWith('01')) {
                cleanPhone = '2' + cleanPhone; // Egypt Country Code
            }
            const message = encodeURIComponent(`السلام عليكم يا ${name}، شفت طلبك على منصة تبديل المواعيد. أنا حابب أبدل معاك الميعاد (${myCurrent}) بميعادك (${myDesired}). هل يناسبك؟`);
            return `https://wa.me/${cleanPhone}?text=${message}`;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }
    </script>
</body>
</html>
